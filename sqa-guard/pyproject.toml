[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sqa-guard"
version = "0.1.0"
description = "Post-quantum security wrapper for AI agents — SQA Dragon Warrior Gateway"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Team Launder Lens", email = "vamsikrishna444@gmail.com" }
]
keywords = ["ai-security", "post-quantum", "llm", "langchain", "crewai", "agent-security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
langchain = ["langchain>=0.2.0"]
crewai   = ["crewai>=0.30.0"]
all      = ["langchain>=0.2.0", "crewai>=0.30.0"]

[project.urls]
Homepage   = "https://github.com/launder-lens/sqa-guard"
Repository = "https://github.com/launder-lens/sqa-guard"

[tool.setuptools.packages.find]
where = ["."]
include = ["sqa_guard*"]
